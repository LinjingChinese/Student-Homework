<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Module 0: 核心生词预览</title>
    <style>
        :root {
            --brand-blue: #34495e;
            --bg-canvas: #f8fafb;
            --text-dark: #2c3e50;
            /* 三类色系 */
            --time-bg: #e8f6f3; /* 薄荷绿 */
            --time-text: #16a085;
            --act-bg: #fef5e7;  /* 浅沙黄 */
            --act-text: #d35400;
            --state-bg: #ebf5fb; /* 雾霾蓝 */
            --state-text: #2e86c1;
        }
        
        body { 
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; 
            background: var(--bg-canvas); 
            padding: 40px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--brand-blue); font-size: 32px; }

        .teacher-panel {
            background: white;
            padding: 12px 30px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 40px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .vocab-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 25px; 
            width: 1000px; 
        }

        .cat-divider {
            grid-column: 1 / -1;
            font-size: 14px;
            font-weight: bold;
            color: #95a5a6;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 20px;
            text-align: center;
        }

        /* 通用卡片样式 */
        .vocab-card {
            border-radius: 20px;
            padding: 35px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.03);
            border: 2px solid transparent;
        }

        /* 悬停放大效果 */
        .vocab-card:hover {
            transform: scale(1.08);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            z-index: 10;
            border-color: rgba(0,0,0,0.1);
        }

        /* 分类底色 */
        .card-time { background-color: var(--time-bg); }
        .card-act { background-color: var(--act-bg); }
        .card-state { background-color: var(--state-bg); }

        /* 文字排版：一行一个 */
        .v-cn { font-size: 36px; font-weight: bold; color: var(--text-dark); display: block; margin-bottom: 8px; }
        .v-py { font-size: 18px; font-weight: 500; display: block; margin-bottom: 8px; }
        .v-en { font-size: 15px; color: #7f8c8d; display: block; }

        /* 分类拼音颜色微调 */
        .card-time .v-py { color: var(--time-text); }
        .card-act .v-py { color: var(--act-text); }
        .card-state .v-py { color: var(--state-text); }

        /* 标记熟练度 (变灰) */
        .vocab-card.mastered {
            background: #e5e8e8 !important;
            opacity: 0.4;
            transform: scale(0.92) !important;
            filter: grayscale(1);
        }
        .vocab-card.mastered::after {
            content: "✓ DONE";
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 10px;
            font-weight: bold;
            color: #7f8c8d;
            border: 1px solid #7f8c8d;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .hide-mode .v-en { opacity: 0; }

        .btn {
            padding: 10px 25px;
            border-radius: 25px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:hover { background: var(--brand-blue); color: white; }
        .btn.active { background: var(--brand-blue); color: white; }
    </style>
</head>
<body class="">

    <div class="header">
        <h1>第06单元：核心生词 (Vocabulary Base)</h1>
    </div>

    <div class="teacher-panel">
        <strong>老师助手:</strong>
        <button class="btn" id="toggleEnBtn" onclick="toggleEn()">👁️ 隐藏英文</button>
        <button class="btn" onclick="resetAll()">🔄 重置卡片</button>
    </div>

    <div class="vocab-grid">
        <div class="cat-divider">Time Units</div>
        <div class="vocab-card card-time" onclick="markMastery(this)">
            <span class="v-cn">点</span><span class="v-py">diǎn</span><span class="v-en">o'clock</span>
        </div>
        <div class="vocab-card card-time" onclick="markMastery(this)">
            <span class="v-cn">分</span><span class="v-py">fēn</span><span class="v-en">minute</span>
        </div>
        <div class="vocab-card card-time" onclick="markMastery(this)">
            <span class="v-cn">刻</span><span class="v-py">kè</span><span class="v-en">quarter (15 mins)</span>
        </div>
        <div class="vocab-card card-time" onclick="markMastery(this)">
            <span class="v-cn">现在</span><span class="v-py">xiànzài</span><span class="v-en">now</span>
        </div>

        <div class="cat-divider">Activity & Place</div>
        <div class="vocab-card card-act" onclick="markMastery(this)">
            <span class="v-cn">电影院</span><span class="v-py">diànyǐngyuàn</span><span class="v-en">cinema</span>
        </div>
        <div class="vocab-card card-act" onclick="markMastery(this)">
            <span class="v-cn">事</span><span class="v-py">shì</span><span class="v-en">matter / affair</span>
        </div>
        <div class="vocab-card card-act" onclick="markMastery(this)">
            <span class="v-cn">下班</span><span class="v-py">xiàbān</span><span class="v-en">get off work</span>
        </div>
        <div class="vocab-card card-act" onclick="markMastery(this)">
            <span class="v-cn">开会</span><span class="v-py">kāihuì</span><span class="v-en">have a meeting</span>
        </div>

        <div class="cat-divider">Grammar & Status</div>
        <div class="vocab-card card-state" onclick="markMastery(this)">
            <span class="v-cn">准时</span><span class="v-py">zhǔnshí</span><span class="v-en">on time</span>
        </div>
        <div class="vocab-card card-state" onclick="markMastery(this)">
            <span class="v-cn">迟到</span><span class="v-py">chídào</span><span class="v-en">be late</span>
        </div>
        <div class="vocab-card card-state" onclick="markMastery(this)">
            <span class="v-cn">呢</span><span class="v-py">ne</span><span class="v-en">(ongoing action)</span>
        </div>
        <div class="vocab-card card-state" onclick="markMastery(this)">
            <span class="v-cn">吧</span><span class="v-py">ba</span><span class="v-en">(suggestion)</span>
        </div>
    </div>

    <script>
        function markMastery(card) {
            card.classList.toggle('mastered');
        }

        function toggleEn() {
            document.body.classList.toggle('hide-mode');
            document.getElementById('toggleEnBtn').classList.toggle('active');
        }

        function resetAll() {
            const cards = document.querySelectorAll('.vocab-card');
            cards.forEach(c => c.classList.remove('mastered'));
        }
    </script>
</body>
</html>
