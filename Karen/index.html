<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Module 1: 看图说话场景练习 (互动增强版)</title>
    <style>
        :root {
            --bg-canvas: #f0f4f7;
            --primary-blue: #2c3e50;
            --accent-green: #16a085;
            --highlight-red: #e74c3c;
            --card-white: #ffffff;
        }
        
        body { font-family: 'PingFang SC', sans-serif; background: var(--bg-canvas); padding: 40px; display: flex; flex-direction: column; align-items: center; }

        .header-box { text-align: center; margin-bottom: 30px; }
        .cn { font-size: 24px; font-weight: bold; color: var(--primary-blue); display: block; }
        .py { font-size: 16px; color: #7f8c8d; display: block; }
        .en { font-size: 12px; color: #95a5a6; display: block; font-style: italic; }

        .period-bar { display: flex; gap: 10px; margin-bottom: 30px; }
        .tag { background: white; padding: 8px 15px; border-radius: 12px; border: 1.5px solid var(--accent-green); text-align: center; }

        .routine-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 1050px; }
        
        .scene-card { 
            background: var(--card-white); border-radius: 20px; padding: 20px; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.05); transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            border: 2px solid transparent;
        }
        .scene-card:hover { border-color: var(--accent-green); transform: translateY(-5px); }

        .icon-circle { width: 70px; height: 70px; background: #f8f9fa; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 10px; }
        .time-box { font-family: 'Courier New', monospace; font-size: 28px; font-weight: bold; color: var(--highlight-red); background: #fff5f5; padding: 5px 15px; border-radius: 10px; margin: 10px 0; }

        .ans-area { margin-top: 10px; width: 100%; background: #f9f9f9; padding: 12px; border-radius: 10px; min-height: 60px; }
        .blur-ans { filter: blur(6px); transition: 0.3s; cursor: pointer; }
        .ans-area:hover .blur-ans { filter: blur(0); }

        .btn-refresh { 
            margin-top: 30px; background: var(--primary-blue); color: white; border: none; 
            padding: 15px 45px; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(44, 62, 80, 0.3);
        }
        .btn-refresh:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="header-box">
        <span class="cn">🖼️ 看图说话：我的生活场景</span>
        <span class="py">Kàn tú shuōhuà: Shēnghuó chǎngjǐng</span>
        <span class="en">Look and Describe: My Daily Routine</span>
    </div>

    <div class="period-bar">
        <div class="tag"><span class="cn" style="font-size:14px">早上</span><span class="en">Early AM</span></div>
        <div class="tag"><span class="cn" style="font-size:14px">上午</span><span class="en">Late AM</span></div>
        <div class="tag"><span class="cn" style="font-size:14px">下午</span><span class="en">PM</span></div>
        <div class="tag"><span class="cn" style="font-size:14px">晚上</span><span class="en">Evening</span></div>
    </div>

    <div class="routine-grid" id="mainGrid">
        </div>

    <button class="btn-refresh" onclick="renderScenes()">🎲 随机生成 (Randomize)</button>

    <script>
        const actions = [
            { icon: "🍳", cn: "做早餐", py: "zuò zǎocān", en: "Make Breakfast", period: "早上" },
            { icon: "💼", cn: "去公司", py: "qù gōngsī", en: "Go to Company", period: "早上" },
            { icon: "📝", cn: "开会", py: "kāihuì", en: "Have a Meeting", period: "上午" },
            { icon: "🍜", cn: "吃午饭", py: "chī wǔfàn", en: "Have Lunch", period: "上午" },
            { icon: "☕", cn: "喝咖啡", py: "hē kāfēi", en: "Drink Coffee", period: "下午" },
            { icon: "🏋️", cn: "运动", py: "yùndòng", en: "Do Sports", period: "下午" },
            { icon: "🎬", cn: "看电影", py: "kàn diànyǐng", en: "Watch a Movie", period: "晚上" },
            { icon: "📖", cn: "看书", py: "kànshū", en: "Read a Book", period: "晚上" },
            { icon: "🛏️", cn: "睡觉", py: "shuìjiào", en: "Go to Sleep", period: "晚上" }
        ];

        const cnNums = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];

        function getCnTime(h, m) {
            let hStr = h === 2 ? "两" : (h <= 10 ? cnNums[h] : "十" + (h % 10 === 0 ? "" : cnNums[h % 10]));
            let mStr = "";
            if (m === 0) mStr = "";
            else if (m === 15) mStr = "一刻";
            else if (m === 30) mStr = "半";
            else if (m === 45) mStr = "三刻";
            else if (m < 10) mStr = "零" + cnNums[m] + "分";
            else {
                let ten = Math.floor(m / 10);
                let unit = m % 10;
                mStr = (ten === 1 ? "十" : cnNums[ten] + "十") + (unit === 0 ? "" : cnNums[unit]) + "分";
            }
            return hStr + "点" + mStr;
        }

        function renderScenes() {
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = ''; // 清空
            
            // 随机抽取 6 个不重复的动作
            const shuffled = [...actions].sort(() => 0.5 - Math.random()).slice(0, 6);

            shuffled.forEach(item => {
                // 根据时段随机生成小时
                let h;
                if (item.period === "早上") h = Math.floor(Math.random() * 3) + 6; // 6-8
                else if (item.period === "上午") h = Math.floor(Math.random() * 3) + 9; // 9-11
                else if (item.period === "下午") h = Math.floor(Math.random() * 5) + 13; // 13-17
                else h = Math.floor(Math.random() * 4) + 19; // 19-22

                // 随机分钟 (0, 15, 30, 45 或 随机数字)
                const mOptions = [0, 15, 30, 45, Math.floor(Math.random() * 59)];
                const m = mOptions[Math.floor(Math.random() * mOptions.length)];
                
                // 转换 24 小时制显示为 12 小时制口语
                const displayH = h > 12 ? h - 12 : h;
                const timeString = `${h < 10 ? '0' + h : h}:${m < 10 ? '0' + m : m}`;
                const fullCn = `我${item.period}${getCnTime(displayH, m)}${item.cn}。`;

                const card = document.createElement('div');
                card.className = 'scene-card';
                card.innerHTML = `
                    <div class="icon-circle">${item.icon}</div>
                    <div style="margin-bottom:10px">
                        <span class="cn">${item.cn}</span>
                        <span class="py">${item.py}</span>
                        <span class="en">${item.en}</span>
                    </div>
                    <div class="time-box">${timeString}</div>
                    <div class="ans-area">
                        <div class="blur-ans">
                            <span class="cn" style="font-size:16px">${fullCn}</span>
                            <span class="en" style="font-size:10px; margin-top:5px">I ${item.en} at ${timeString} in the ${item.period === '晚上' ? 'evening' : item.period.toLowerCase()}.</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 页面加载时运行一次
        window.onload = renderScenes;
    </script>
</body>
</html>
